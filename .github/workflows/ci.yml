name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build
        run: make

      - name: Run tests
        run: make test

      - name: Run tests with AddressSanitizer
        run: |
          make debug
          ./tests/run_tests.sh ./mysh-debug

      - name: Fuzz the parser for 60 seconds
        run: make fuzz FUZZCXX=clang++
